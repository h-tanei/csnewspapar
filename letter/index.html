    body {
      font-family: sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    /* 左側：入力エリア */
    .editor-section {
      flex: 1;
      min-width: 300px;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .editor-section h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .counter-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
      margin-top: 5px;
    }

    .counter-info.warning {
      color: #e74c3c;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
      line-height: 1.5;
      resize: none;
    }

    .btn-print {
      width: 100%;
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-print:hover {
      background-color: #1a252f;
    }

    .preview-section {
      flex: 1.5;
      min-width: 320px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
