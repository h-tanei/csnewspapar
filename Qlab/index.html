<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLab Simulator (Full Setup)</title>
<style>
  body { margin: 0; font-family: sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  /* 舞台状況エリア */
  #stage-monitor { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000; border-bottom: 2px solid #333; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  
  /* 上部に配置するUI（リセット＆タイマー） */
  #top-bar { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
  .btn-reset { background-color: #555; color: white; border: 1px solid #777; border-radius: 5px; padding: 8px 15px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
  .btn-reset:active { background-color: #333; }
  #timer-display { text-align: center; font-size: 32px; font-family: monospace; font-weight: bold; background: rgba(0,0,0,0.7); color: #ff3b30; border: 2px solid #ff3b30; border-radius: 8px; padding: 5px 15px; box-shadow: 0 0 10px #ff3b30; letter-spacing: 2px; }
  .spacer { width: 80px; } /* レイアウトバランス用 */

  #stage-visual { font-size: 28px; font-weight: bold; margin-bottom: 10px; color: #4CAF50; transition: color 0.3s; z-index: 5; }
  #stage-audio { font-size: 18px; color: #aaa; z-index: 5; }
  
  /* 下部UIラッパー (スマホUI + 横のベルボタン) */
  #bottom-area { flex: 2; display: flex; position: relative; justify-content: center; align-items: center; background-color: #1a1a1a; padding: 10px; }
  
  /* スマホUIエリア */
  #phone-ui { max-width: 400px; width: 100%; height: 98%; background-color: #222; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 20px; border: 2px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  
  .header { background-color: #a020f0; text-align: center; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 5px; margin-bottom: 12px; }
  
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  
  /* ボタン共通スタイル */
  .btn { background-color: #444; border: 1px solid #666; border-radius: 8px; padding: 15px 10px; display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer; user-select: none; position: relative; overflow: hidden; transition: background-color 0.2s; }
  
  /* 斜線（無効状態） */
  .btn.stripe { background: repeating-linear-gradient(45deg, #444, #444 10px, #333 10px, #333 20px); color: #888; border-color: #444; cursor: not-allowed; }
  .btn.stripe .btn-desc { opacity: 0.3; }
  
  .btn.active { border-color: #fff; background-color: #666; }
  .btn-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; pointer-events: none; }
  .btn-desc { font-size: 11px; background: white; color: black; padding: 2px 5px; border-radius: 3px; display: inline-block; pointer-events: none; }
  
  /* GOボタン特化 */
  .btn-go { background-color: #ffd700; color: #000; border: none; justify-content: center; align-items: center; cursor: pointer; }
  .btn-go:active { background-color: #ccac00; transform: scale(0.98); }
  .btn-go .btn-title { font-size: 24px; }
  
  .icon-top-right { position: absolute; top: 10px; right: 10px; font-size: 14px; }

  /* ベルボタン (横の黒い空間に配置・正方形に変更) */
  #bell-btn { position: absolute; right: calc(50% - 290px); width: 85px; height: 85px; background-color: #000; border: 3px solid #ff3b30; border-radius: 12px; box-shadow: 0 0 15px #ff3b30, inset 0 0 15px #ff3b30; color: #ff3b30; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; transition: transform 0.1s, box-shadow 0.1s; }
  #bell-btn:active { transform: scale(0.9); box-shadow: 0 0 30px #ff3b30, inset 0 0 30px #ff3b30; background-color: #200; }
  #bell-btn::before { content: 'BELL'; margin-bottom: 5px; font-size: 16px; }
  
  /* カランコロン エフェクト */
  .bell-effect { position: absolute; font-size: 36px; font-weight: bold; color: yellow; text-shadow: 0 0 20px orange, 2px 2px 0px #000; animation: floatUpFadeOut 1.5s forwards; pointer-events: none; z-index: 20; }
  @keyframes floatUpFadeOut {
    0% { opacity: 1; transform: translateY(0) scale(1) rotate(-5deg); }
    50% { transform: translateY(-50px) scale(1.2) rotate(5deg); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5) rotate(-5deg); }
  }

  @media (max-width: 650px) {
    #bell-btn { right: 10px; top: 20px; width: 65px; height: 65px; font-size: 11px; }
    #timer-display { font-size: 24px; padding: 5px 10px; }
  }
</style>
</head>
<body>

      <div class="btn btn-go" onclick="fireGo()">

      </div>
    </div>
  </div>

  <div id="bell-btn" onclick="ringBell()">🔔</div>
</div>

  let currentCueKey = "0";
  let isBlackout = false;
  let autoTimeout = null;

  // タイマー
  let timerInterval = null;
  let timeLeft = 70 * 60; // 70分
  let userTimePaused = false;

  function updateUI() {
    clearTimeout(autoTimeout);
    const cue = cueData[currentCueKey];
    
    // Stage更新
    const visualEl = document.getElementById('stage-visual');
    if(isBlackout) {
      visualEl.innerText = "【完全に暗転】";
      visualEl.style.color = "#555";
    } else {
      visualEl.innerText = cue.visual;
      visualEl.style.color = "#4CAF50";
    }
    document.getElementById('stage-audio').innerText = cue.audio;
    document.getElementById('ui-now').innerText = cue.now;
    document.getElementById('ui-next').innerText = cue.next;

    // 斜線制御
    document.getElementById('btn-light').classList.toggle('stripe', !cue.light);
    document.getElementById('btn-success').classList.toggle('stripe', !cue.select);
    document.getElementById('btn-falled').classList.toggle('stripe', !cue.select);
    updateTimecallButton();

    // 自動進行判定
    if (cue.auto) {
      autoTimeout = setTimeout(() => {
        fireGo(cue.nextCue);
      }, cue.auto);
    }
  }

  function fireGo(forceNext = null) {
    const cue = cueData[currentCueKey];
    if (cue.isWait && !forceNext) {
      alert("⚠️ ルート選択（success / falled）を押してください。");
      return;
    }

    const next = forceNext || cue.nextCue;
    if (cueData[next]) {
      currentCueKey = next;
      isBlackout = false;
      updateUI();
    }
  }

  function toggleLight() {
    if (!cueData[currentCueKey].light) return;
    isBlackout = !isBlackout;
    updateUI();
  }

  function selectRoute(route) {
    if (!cueData[currentCueKey].select) return;
    currentCueKey = (route === 'success') ? "41" : "31";
    isBlackout = false;
    updateUI();
  }

  function toggleTimecall() {
    if (timeLeft > 180) return;
    userTimePaused = !userTimePaused;
    updateTimecallButton();
  }

  function ringBell() {
    const stage = document.getElementById('stage-monitor');
    const effect = document.createElement('div');
    effect.className = 'bell-effect';
    effect.innerText = 'カランコロン♪';
    effect.style.left = (Math.random() * 50 + 20) + '%';
    effect.style.top = (Math.random() * 40 + 30) + '%';
    stage.appendChild(effect);
    setTimeout(() => { effect.remove(); }, 1500);
  }

  function resetSim() {
    clearTimeout(autoTimeout);
    currentCueKey = "0";
    isBlackout = false;
    timeLeft = 70 * 60;
    userTimePaused = false;
    updateTimerDisplay();
    updateUI();
  }

  function startEngine() {
    if (!timerInterval) {
      timerInterval = setInterval(() => {
        const timerState = cueData[currentCueKey].timer;
        if (!userTimePaused && (timerState === 'run' || timerState === 'start')) {
          timeLeft -= 1; // 0.5秒で1減る (倍速)
          if (timeLeft < 0) timeLeft = 0;
          updateTimerDisplay();
          updateTimecallButton();
        }
      }, 500);
    }
  }

  function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').innerText = `${m}:${s}`;
  }

  function updateTimecallButton() {
    const btn = document.getElementById('btn-timecall');
    if (timeLeft <= 180) {
      btn.classList.remove('stripe');
    } else {
      btn.classList.add('stripe');
    }
    if (userTimePaused) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  // 初期起動
  updateTimerDisplay();
  updateUI();
  startEngine();
</script>

</body>
</html>
