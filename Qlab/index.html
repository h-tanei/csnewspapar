<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLab Simulator (Advanced)</title>
<style>
  body { margin: 0; font-family: sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  /* 舞台状況エリア */
  #stage-monitor { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000; border-bottom: 2px solid #333; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  #stage-visual { font-size: 28px; font-weight: bold; margin-bottom: 10px; color: #4CAF50; transition: color 0.3s; }
  #stage-audio { font-size: 18px; color: #aaa; }
  
  /* 下部UIラッパー (スマホUI + 横のベルボタン) */
  #bottom-area { flex: 2; display: flex; position: relative; justify-content: center; align-items: center; background-color: #1a1a1a; }
  
  /* スマホUIエリア */
  #phone-ui { max-width: 400px; width: 100%; height: 95%; background-color: #222; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 20px; border: 2px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  
  /* ヘッダー＆リセットボタン */
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .header { background-color: #a020f0; text-align: center; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 5px; flex: 1; margin-right: 10px; }
  .btn-reset { background-color: #555; color: white; border: 1px solid #777; border-radius: 5px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-reset:active { background-color: #333; }

  /* タイマー表示 */
  #timer-display { text-align: center; font-size: 32px; font-family: monospace; font-weight: bold; background: #000; color: #ff3b30; border: 2px solid #ff3b30; border-radius: 8px; margin-bottom: 10px; padding: 5px; box-shadow: 0 0 10px #ff3b30; letter-spacing: 2px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  
  /* ボタン共通スタイル */
  .btn { background-color: #444; border: 1px solid #666; border-radius: 8px; padding: 15px 10px; display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer; user-select: none; position: relative; overflow: hidden; transition: background-color 0.2s; }
  .btn.stripe { background: repeating-linear-gradient(45deg, #444, #444 10px, #333 10px, #333 20px); color: #888; border-color: #444; cursor: not-allowed; }
  .btn.stripe .btn-desc { opacity: 0.5; }
  
  .btn.active { border-color: #fff; background-color: #666; } /* 選択/トグル状態 */
  .btn-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; pointer-events: none; }
  .btn-desc { font-size: 11px; background: white; color: black; padding: 2px 5px; border-radius: 3px; display: inline-block; pointer-events: none; }
  
  /* GOボタン特化 */
  .btn-go { background-color: #ffd700; color: #000; border: none; justify-content: center; align-items: center; cursor: pointer; }
  .btn-go:active { background-color: #ccac00; transform: scale(0.98); }
  .btn-go .btn-title { font-size: 24px; }
  
  .icon-top-right { position: absolute; top: 10px; right: 10px; font-size: 14px; }

  /* ベルボタン (横の黒い空間に配置) */
  #bell-btn { position: absolute; right: calc(50% - 280px); /* スマホ画面の右横あたり */ width: 80px; height: 80px; background-color: #000; border: 3px solid #ff3b30; border-radius: 50%; box-shadow: 0 0 15px #ff3b30, inset 0 0 15px #ff3b30; color: #ff3b30; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; user-select: none; transition: transform 0.1s, box-shadow 0.1s; }
  #bell-btn:active { transform: scale(0.9); box-shadow: 0 0 30px #ff3b30, inset 0 0 30px #ff3b30; background-color: #200; }
  #bell-btn::before { content: 'BELL'; margin-bottom: 5px; }
  
  /* ベル鳴動エフェクト */
  .bell-effect { position: absolute; font-size: 70px; color: yellow; text-shadow: 0 0 20px orange; animation: floatUpFadeOut 1.5s forwards; pointer-events: none; }
  @keyframes floatUpFadeOut {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }

  /* スマホ等で画面幅が狭い場合はベルボタンを右上に逃がす */
  @media (max-width: 600px) {
    #bell-btn { right: 10px; top: 10px; width: 60px; height: 60px; font-size: 10px; }
  }
</style>
</head>
<body>

<div id="stage-monitor">
  <div id="stage-visual">【待機画面】</div>
  <div id="stage-audio">🎵 入場中BGM 再生中</div>
</div>

<div id="bottom-area">
  <div id="phone-ui">
    <div class="header-bar">
      <div class="header">Show Mode - OSC Access: View, Control</div>
      <button class="btn-reset" onclick="resetSim()">RESET</button>
    </div>
    
    <!-- 追加: タイマー -->
    <div id="timer-display">70:00</div>

    <div class="grid">
      <div id="btn-light" class="btn stripe" onclick="toggleLight()">
        <div class="icon-top-right">▶</div>
        <div class="btn-title">light・暗転</div>
        <div class="btn-desc">電気のONOFF</div>
      </div>
      <div class="btn">
        <div class="icon-top-right">💬</div>
        <div class="btn-title">Now・<span id="ui-now">客入れ</span></div>
        <div class="btn-desc">今の流れているキュー</div>
      </div>
      
      <div id="btn-success" class="btn stripe" onclick="selectRoute('success')">
        <div class="icon-top-right">▶</div>
        <div class="btn-title">success・成功選択</div>
        <div class="btn-desc">ボタンでもここでも</div>
      </div>
      <div class="btn">
        <div class="icon-top-right">💬</div>
        <div class="btn-title">Next・<span id="ui-next">3回ベル</span></div>
        <div class="btn-desc">次のを確認したいね</div>
      </div>
      
      <div id="btn-falled" class="btn stripe" onclick="selectRoute('falled')">
        <div class="icon-top-right">▶</div>
        <div class="btn-title">falled・失敗選択</div>
        <div class="btn-desc">ボタンでもここでも</div>
      </div>
      <div class="btn">
        <div class="icon-top-right">💬</div>
        <div class="btn-title">select・未選択</div>
        <div class="btn-desc">ここはわからない</div>
      </div>
      
      <div id="btn-timecall" class="btn stripe" onclick="toggleTimecall()">
        <div class="icon-top-right">▶</div>
        <div class="btn-title">Timecall・ストップ</div>
        <div class="btn-desc">3分以下で機能</div>
      </div>
      <div class="btn btn-go" onclick="fireGo()">
        <div class="btn-title">GO</div>
        <div class="btn-desc">いつものGO</div>
      </div>
    </div>
  </div>

  <!-- 横の黒い空間に置くベルボタン -->
  <div id="bell-btn" onclick="ringBell()">🔔</div>
</div>

<script>
  // キューリスト (timer: start/runで動く, pause/stopで止まる。 light/select: trueの時だけ斜線が外れて操作可能)
  const cues = [
    { now: "客入れ", next: "3回ベル", visual: "【待機画面】", audio: "🎵 入場中BGM", timer: "stop", light: false, select: false },
    { now: "3回ベル", next: "モカ「わたし…」", visual: "【OP映像 再生中】", audio: "🔈 OP音声", timer: "stop", light: false, select: false },
    { now: "モカ「わたし…」", next: "タイトル終わり", visual: "【待機画面(暗転)】", audio: "🗣️ ラジオ音声 / ナレーション", timer: "stop", light: false, select: false },
    { now: "タイトル終わり", next: "着信", visual: "【タイトル映像 再生中】", audio: "🔈 映像音声 (タイマースタート)", timer: "start", light: true, select: false },
    { now: "着信", next: "電話切る", visual: "【待機画面】", audio: "📱 携帯着信音 鳴動中", timer: "run", light: true, select: false },
    { now: "電話切る", next: "Hint1", visual: "【待機画面】", audio: "📱 着信音停止", timer: "run", light: true, select: false },
    { now: "Hint1", next: "時空移動開始", visual: "【待機画面】", audio: "🗣️ ヒント音声再生", timer: "pause", light: true, select: false },
    { now: "時空移動開始", next: "転換完了", visual: "【暗転】", audio: "🌀 タイムリープ演出中...", timer: "pause", light: false, select: false },
    { now: "転換完了", next: "アロマストップ", visual: "【待機画面】", audio: "🎵 タイマー・ラジオ再開", timer: "run", light: false, select: false },
    { now: "アロマストップ", next: "着信2", visual: "【待機画面】", audio: "💣 時限爆弾SE", timer: "run", light: false, select: true },
    { now: "着信2", next: "電話切る2", visual: "【待機画面】", audio: "📱 着信音 鳴動中", timer: "run", light: false, select: true },
    { now: "電話切る2", next: "モカ「えいっ」", visual: "【待機画面】", audio: "📱 着信音停止", timer: "run", light: false, select: true },
    { now: "モカ「えいっ」", next: "モカ語り", visual: "【モカ情報 画像表示】", audio: "🗣️ えいっSE", timer: "run", light: false, select: true },
    { now: "モカ語り", next: "モカ語り終", visual: "【モカ情報 画像表示】", audio: "🗣️ モカ語り音声", timer: "run", light: false, select: true },
    { now: "モカ語り終", next: "分岐待機", visual: "【待機画面】", audio: "🎵 最終BGM (ルートを選択してください)", timer: "run", light: false, select: false },
    // 以下は分岐先のキュー
    { now: "【成功ルート】", next: "転換終わったら", visual: "【成功 タイムスリップ演出】", audio: "🎵 タイマー停止", timer: "pause", light: false, select: false },
    { now: "【失敗ルート】", next: "時空移動", visual: "【失敗映像 再生中】", audio: "💣 失敗BGM", timer: "pause", light: false, select: false }
  ];

  let currentCueIndex = 0;
  let isBlackout = false;

  // タイマー関連変数
  let timerInterval = null;
  let timeLeft = 70 * 60; // 70分 = 4200秒
  let userTimePaused = false; // ボタンでの手動ストップ状態

  function updateUI() {
    const cue = cues[currentCueIndex];
    
    // Stageの更新
    const visualEl = document.getElementById('stage-visual');
    if(isBlackout) {
      visualEl.innerText = "【完全に暗転】";
      visualEl.style.color = "#555";
    } else {
      visualEl.innerText = cue.visual;
      visualEl.style.color = "#4CAF50";
    }
    document.getElementById('stage-audio').innerText = cue.audio;
    document.getElementById('ui-now').innerText = cue.now;
    document.getElementById('ui-next').innerText = cue.next;

    // ボタンの斜線(stripe)制御
    document.getElementById('btn-light').classList.toggle('stripe', !cue.light);
    document.getElementById('btn-success').classList.toggle('stripe', !cue.select);
    document.getElementById('btn-falled').classList.toggle('stripe', !cue.select);
    
    updateTimecallButton();
  }

  function fireGo() {
    if (currentCueIndex < 14) { // 分岐前まで
      currentCueIndex++;
      isBlackout = false;
      updateUI();
    } else if (currentCueIndex === 14) {
      alert("⚠️ ルート選択（success / falled）を押してください。");
    } else {
      alert("シミュレーションはここまでです。Resetを押してください。");
    }
  }

  // --- 各種ボタン機能 ---
  function toggleLight() {
    if (!cues[currentCueIndex].light) return; // 斜線の時は無効
    isBlackout = !isBlackout;
    updateUI();
  }

  function selectRoute(route) {
    if (!cues[currentCueIndex].select) return; // 斜線の時は無効
    if (route === 'success') {
      currentCueIndex = 15; // 成功用キューへ
    } else {
      currentCueIndex = 16; // 失敗用キューへ
    }
    isBlackout = false;
    updateUI();
  }

  function toggleTimecall() {
    if (timeLeft > 180) return; // 3分以上なら無効
    userTimePaused = !userTimePaused;
    updateTimecallButton();
  }

  function ringBell() {
    // ベルエフェクトをStageに発生させる
    const stage = document.getElementById('stage-monitor');
    const effect = document.createElement('div');
    effect.className = 'bell-effect';
    effect.innerText = '🔔リンッ！';
    // Stage内でランダムな位置に表示
    effect.style.left = (Math.random() * 60 + 20) + '%';
    effect.style.top = (Math.random() * 40 + 30) + '%';
    stage.appendChild(effect);
    
    // 1.5秒後に削除
    setTimeout(() => { effect.remove(); }, 1500);
  }

  function resetSim() {
    currentCueIndex = 0;
    isBlackout = false;
    timeLeft = 70 * 60; // 70分に戻す
    userTimePaused = false;
    updateTimerDisplay();
    updateUI();
  }

  // --- タイマー制御 ---
  function startEngine() {
    if (!timerInterval) {
      timerInterval = setInterval(() => {
        const cueTimerState = cues[currentCueIndex].timer; // 'run', 'start', 'stop', 'pause'
        // キューが動く状態で、かつユーザーがストップを押していなければカウントダウン
        if (!userTimePaused && (cueTimerState === 'run' || cueTimerState === 'start')) {
          timeLeft -= 1; // 500ms(0.5秒)ごとに1秒減る＝【倍速カウントダウン】
          if (timeLeft < 0) timeLeft = 0;
          updateTimerDisplay();
          updateTimecallButton(); // 3分切った時の解除判定のため
        }
      }, 500);
    }
  }

  function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer-display').innerText = `${m}:${s}`;
  }

  function updateTimecallButton() {
    const btn = document.getElementById('btn-timecall');
    // 残り3分(180秒)以下なら斜線を外す
    if (timeLeft <= 180) {
      btn.classList.remove('stripe');
    } else {
      btn.classList.add('stripe');
    }
    
    // 一時停止状態なら色を変えてわかりやすくする
    if (userTimePaused) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  // 初期化と起動
  updateTimerDisplay();
  updateUI();
  startEngine();
</script>

</body>
</html>
